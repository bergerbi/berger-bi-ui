name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: JavaScript parses
        run: for f in skills/berger-bi-ui/*.js; do node --check "$f"; done
      - name: Plugin files are valid JSON
        run: python -c "import json; [json.load(open(p)) for p in ('.claude-plugin/plugin.json','.claude-plugin/marketplace.json')]"
      - name: Skill stays light (bytes, not lines - Hebrew is token-heavy)
        run: |
          test $(wc -c < skills/berger-bi-ui/SKILL.md) -le 4500 || { echo "SKILL.md over 4.5KB: move detail to docs/"; exit 1; }
          for f in skills/berger-bi-ui/docs/*.md; do test $(wc -c < "$f") -le 22000 || { echo "$f over 22KB"; exit 1; }; done
          test $(wc -c < skills/berger-bi-ui/starter.html) -le 18000 || { echo "starter.html over 18KB"; exit 1; }
      - name: Built pages match the source
        run: |
          python -I tools/build_reference.py
          git diff --exit-code -- reference.html index.html artifact/ || { echo "Run: python -I tools/build_reference.py, then commit"; exit 1; }
      - name: Rule check in a real browser (all screens x desktop/dark/CEO/tablet/phone)
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/audit.mjs
